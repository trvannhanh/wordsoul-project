name: Azure Static Web Apps CI/CD

on:
  push:
    branches:
      - main
    paths:
      - 'wordsoul-app/**' # Chỉ kích hoạt khi có thay đổi trong thư mục frontend cũ
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - main
    paths:
      - 'wordsoul-app/**' # Chỉ kích hoạt khi có thay đổi trong thư mục frontend cũ

jobs:
  build_and_deploy_job:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    name: Build and Deploy Job

    steps:
      - uses: actions/checkout@v3
        with:
          submodules: true
          lfs: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        working-directory: ./wordsoul-app
        run: |
          # Xóa lock file nếu cần để tránh xung đột phiên bản, sau đó cài đặt
          rm -f package-lock.json
          npm install

      - name: Build
        working-directory: ./wordsoul-app
        run: npm run build
        env:
          VITE_API_URL: https://wordsoul-api-dev-hybybqh9dhhzhped.southeastasia-01.azurewebsites.net/api

      - name: Deploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_WONDERFUL_ROCK_05CE45A00 }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: "upload"
          app_location: "./wordsoul-app/dist"  # Đường dẫn tới thư mục chứa kết quả build của Vite
          api_location: ""
          output_location: ""                  # Để trống vì app_location đã trỏ thẳng vào thư mục đích
          skip_app_build: true                 # Bắt buộc là true vì bạn đã tự build ở step trên

  close_pull_request_job:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: Close Pull Request Job
    steps:
      - name: Close Pull Request
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_WONDERFUL_ROCK_05CE45A00 }}
          action: "close"
